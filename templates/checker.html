<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hh35 Tik | الفحص</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><b>hh35 Tik</b><nav><a href="{{ url_for('checker') }}">الفحص</a><a href="{{ url_for('logout') }}">خروج</a></nav></header><main>
<section class="card"><h1>فحص يوزرات TikTok</h1><p>اكتب اليوزر بدون @ ثم اضغط فحص.</p><form id="checkForm"><div class="row"><input name="username" placeholder="hh35" required autocomplete="off"><button>فحص</button></div></form><div id="result" class="result hidden"></div></section>
<section class="card"><h2>بحث تلقائي</h2><p>يولد اسمين في كل جولة ويفحصهما تدريجيًا. اضغط إيقاف في أي وقت.</p><div class="row"><select id="length"><option value="3">ثلاثي</option><option value="4">رباعي</option><option value="5" selected>خماسي</option><option value="6">سداسي</option></select><button id="start">تشغيل</button><button id="stop" type="button" class="secondary" disabled>إيقاف</button></div><p id="state">متوقف</p><div id="found"></div></section><section class="note">الفحص يعتمد على استجابة TikTok العامة. إذا منع TikTok الطلب سيظهر «غير قابل للتأكيد» ولن نعرض الاسم على أنه متاح.</section></main><script>
const form=document.querySelector('#checkForm'), result=document.querySelector('#result'), start=document.querySelector('#start'), stop=document.querySelector('#stop'), state=document.querySelector('#state'), found=document.querySelector('#found'); let running=false;
function show(data){result.className='result';result.innerHTML='<strong>'+data.status+'</strong>'+(data.message?'<small>'+data.message+'</small>':'');}
form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;b.textContent='يفحص...';try{show(await (await fetch('/api/check',{method:'POST',body:new FormData(form)})).json())}finally{b.disabled=false;b.textContent='فحص'}};
async function round(){const fd=new FormData();fd.append('length',document.querySelector('#length').value);const data=await (await fetch('/api/suggestions',{method:'POST',body:fd})).json();for(const username of data.values){if(!running)break;const check=new FormData();check.append('username',username);const answer=await (await fetch('/api/check',{method:'POST',body:check})).json();if(answer.status==='غير مستخدم'){const item=document.createElement('div');item.className='found';item.innerHTML='<b>'+username+'</b><button type="button">نسخ</button>';item.querySelector('button').onclick=()=>navigator.clipboard.writeText(username);found.prepend(item)}state.textContent='آخر فحص: '+username;await new Promise(r=>setTimeout(r,2100))}}
start.onclick=async()=>{if(running)return;running=true;start.disabled=true;stop.disabled=false;state.textContent='يعمل الآن';while(running){try{await round()}catch(e){state.textContent='تعذر الفحص مؤقتًا';await new Promise(r=>setTimeout(r,3000))}}};stop.onclick=()=>{running=false;start.disabled=false;stop.disabled=true;state.textContent='تم الإيقاف'};
</script></body></html>
